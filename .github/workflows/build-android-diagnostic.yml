name: Build TON VIDEO PRO Diagnostic APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-diagnostic/**"
      - ".github/workflows/build-android-diagnostic.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37" "build-tools;37.0.0"
      - name: Build debug APK
        working-directory: android-diagnostic
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ton-video-pro-diagnostic-debug
          path: android-diagnostic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
