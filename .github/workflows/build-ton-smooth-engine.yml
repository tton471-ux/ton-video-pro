name: Build TON SMOOTH ENGINE APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android-smooth-engine/**"
      - ".github/workflows/build-ton-smooth-engine.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-smooth-engine
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ton-smooth-engine-debug
          path: android-smooth-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
